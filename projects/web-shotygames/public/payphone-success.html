<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesando pago...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loading {
      text-align: center;
      color: #666;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #e11d48;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Procesando tu pago...</p>
  </div>

  <script>
    // Get PayPhone response parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const payphoneParams = {
      id: urlParams.get('id'),
      clientTransactionId: urlParams.get('clientTransactionId')
    };

    // Send message to parent window with payment result
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'PAYPHONE_COMPLETE',
        params: payphoneParams
      }, '*');
    } else {
      // If not in iframe, redirect directly
      const confirmUrl = `/confirmacion-tarjeta?id=${payphoneParams.id}&clientTransactionId=${payphoneParams.clientTransactionId}`;
      window.location.href = confirmUrl;
    }
  </script>
</body>
</html>
