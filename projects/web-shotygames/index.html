  <body>
    <!-- Meta Pixel Code (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1383845523178174&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
    <div id="root"></div>
    <script>
      // Red de seguridad contra pantalla en blanco en la CARGA INICIAL
      // (distinto del reintento de rutas lazy, que solo cubre navegación
      // dentro de la app ya cargada). Si el script principal falla al
      // cargar/ejecutar — deploy justo en ese momento, red del celular
      // cortada a mitad de la descarga, etc. — React nunca arranca y no
      // hay nada de React que pueda mostrar un mensaje. Este script plano
      // no depende de React: detecta el fallo y recarga una sola vez.
      (function () {
        var FLAG = "boot-reload-attempted";
        function reloadOnce() {
          if (!sessionStorage.getItem(FLAG)) {
            sessionStorage.setItem(FLAG, "1");
            window.location.reload();
          }
        }
        // Caso 1: el <script type="module"> falla al cargar (error de red).
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") reloadOnce();
          },
          true,
        );
        // Caso 2: el script cargó pero React nunca llegó a montar nada
        // (ej. un chunk secundario que también falló silenciosamente).
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount === 0) reloadOnce();
          }, 6000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
